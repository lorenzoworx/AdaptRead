[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "adaptread"
version = "1.0.0"
description = "A contextual-bandit testbed for adaptive reading presentations using simulated readers."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "AdaptRead contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.1,<3",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
experiments = ["matplotlib>=3.9,<4"]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
adaptread-experiment = "adaptread.experiments.runner:main"
adaptread-api = "adaptread.api.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptread"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["adaptread"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
