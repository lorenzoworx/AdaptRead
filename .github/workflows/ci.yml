name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra experiments
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: cd /tmp && uv run --project "$GITHUB_WORKSPACE" python -c "import adaptread; print(adaptread.__version__)"
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: uv sync --extra dev --extra experiments
        working-directory: .
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  production:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag adaptread:smoke .
      - name: Start production image
        run: docker run --detach --name adaptread-smoke --publish 8000:8000 adaptread:smoke
      - name: Wait for health check
        run: |
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker logs adaptread-smoke
          exit 1
      - name: Exercise deployed API contract
        run: python scripts/smoke_deployment.py http://127.0.0.1:8000

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, production]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/adaptread:latest
            ghcr.io/${{ github.repository_owner }}/adaptread:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: [self-hosted, macOS, ARM64, adaptread-production]
    timeout-minutes: 30
    concurrency:
      group: adaptread-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}/projects/adaptread/
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy and verify the exact commit
        env:
          DEPLOY_STACK_DIR: ${{ vars.DEPLOY_STACK_DIR }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          chmod -R a+rX "$GITHUB_WORKSPACE"
          lockf -t 3600 -k /tmp/boywithabot-production-deploy.lock bash scripts/deploy-production.sh
