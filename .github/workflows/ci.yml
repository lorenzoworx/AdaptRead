name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: cd /tmp && uv run --project "$GITHUB_WORKSPACE" python -c "import adaptread; print(adaptread.__version__)"
